version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: labelguard-postgres
    restart: always
    environment:
      POSTGRES_USER: labelguard
      POSTGRES_PASSWORD: labelguard_secure_password_2026
      POSTGRES_DB: labelguard_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labelguard -d labelguard_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: labelguard-backend
    restart: always
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - DATABASE_URL=postgresql://labelguard:labelguard_secure_password_2026@postgres:5432/labelguard_db
      - SECRET_KEY=labelguard-metrology-secret-key-2026-secure-jwt-token
    ports:
      - "8000:8000"
    volumes:
      - ./backend/uploads:/app/uploads
      - ./backend/reports_generated:/app/reports_generated

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: labelguard-frontend
    restart: always
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  postgres_data:
